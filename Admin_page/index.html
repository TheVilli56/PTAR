<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTAR FES Acatlán - Inicio</title>
    <link rel="stylesheet" href="css_admin/index_styles.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="top-bar">
        <div class="logo-section">
            <img src="images/logoUnam.png" alt="Logo UNAM">
        </div>
        <div class="logo-section acatlan-logo-section">
            <img src="images/logoAcatlan.png" alt="Logo FES Acatlán">
        </div>
    </header>

    <nav class="navbar">
        <a href="../index.html"class="nav-link">Inicio</a> 
        <a href="index.html" class="nav-link">Inicio de Usuario</a> 
        <a href="riego.html" class="nav-link">Riego</a>
        <a href="sst.html" class="nav-link">Sólidos de Muestreo</a>
    </nav>

    <main class="content"> 
        <img src="images/logo-ptar.png" alt="Logo PTAR" class="ptar-logo-main">

        <div class="user-card-container">
            <div class="user-card">
                <i class="fas fa-user user-icon"></i>
            </div>
            <div class="welcome-message-container">
                <p class="welcome-message">Bienvenido</p>
                <p class="username">Usuario</p>
            </div>
            <button class="logout-button" onclick="window.location.href='https://www.acatlan.unam.mx/'">
                Cerrar Sesión
            </button>
        </div>
    </main>

    <img src="images/fondo.jpeg" alt="Fondo de planta de tratamiento" class="background-image">

    <script>
        function cerrarSesion() {
            window.location.href = 'http://www.acatlan.unam.mx/'; 
        }
    </script>

</body>
</html>
