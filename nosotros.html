					<div class="carasA">

							<h3 class="NM">Mtra. Malagón Juárez Norma Angélica</h3>

					</div>
					<div class="carasA">
						<div class="carasAB" data-info="Ing. Laura Sánchez - Responsable del análisis de calidad de agua y monitoreo de parámetros.">
							<h3 class="NM">Mtra. Lopez Blanco Alma</h3>

					<div id="popupInfo" class="popup-info"></div>
				</div>

			</div>
			
		</div>
		
		<script>
			// Animación de aparición al hacer scroll
			document.addEventListener('DOMContentLoaded', () => {
				const reveals = document.querySelectorAll('.no');
				const observer = new IntersectionObserver((entries) => {
					entries.forEach(entry => {
						if (entry.isIntersecting) {
							entry.target.classList.add('visible');
						} else {
							entry.target.classList.remove('visible');
						}
					});
				}, {
					threshold: 0.25 
				});
				reveals.forEach(el => observer.observe(el));
			});
			
			// Mostrar información al hacer clic en las tarjetas
			const caras = document.querySelectorAll('.carasAB');
			const popup = document.getElementById('popupInfo');
			
			caras.forEach(cara => {
				cara.addEventListener('click', function(e) {
					// Ocultar todos los textos de información primero
					document.querySelectorAll('.info-text').forEach(text => {
						text.classList.remove('visible');
					});
					
					// Mostrar el texto de información debajo de la imagen
					const infoText = this.querySelector('.info-text');
					infoText.classList.add('visible');
					
					
					
					// Calcula posición cerca del div clickeado
					const rect = cara.getBoundingClientRect();
					popup.style.left = (rect.right + window.scrollX + 10) + 'px';
					popup.style.top = (rect.top + window.scrollY) + 'px';
					
					e.stopPropagation();
				});
			});
			
			// Ocultar información al hacer clic en cualquier parte
			window.addEventListener('click', function() {
				popup.style.display = 'none';
				// También ocultar todos los textos de información
				document.querySelectorAll('.info-text').forEach(text => {
					text.classList.remove('visible');
				});
			});
		</script>
