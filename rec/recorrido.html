<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="estilos/style_index.css">

    </head>
    <body>
        <main class="container">
            <div class="conR">
                <header class="he">
                    <div >
                        <img src="unamL.png" alt="Imagen 1", width="100px">
                       
                    </div>
                    <div >
                        <img src="fesl.png" alt="Imagen 1", width="200px">
                    </div>
                </header>
                
            </div>
            <div class="dividir">
                <div>
                    <p>Recorrido de la PTAR</p>
                </div>
                <div class="rec">
                    <div id="threejs-container" tabindex="0">
                        <div id="info">
                        W/A/S/D: Moverse, Mouse: Mirar, Click: Activar
                        </div>
                        
                        <div id="object-info">
                            <button id="close-info">×</button>
                            <h3 id="info-title">Información del Objeto</h3>
                            <p id="info-content">Aquí aparecerá la información del objeto seleccionado.</p>
                        </div>
                        <div id="reticula">+</div>
                    </div>

                    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
                    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
                    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
                    <script>
                        // Variables globales
                        let scene, camera, renderer;
                        let ramp;
                        let murosColliders = [];
                        let interactiveObjects = [];

                        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
                        let isControlsEnabled = false;

                        let velocity = new THREE.Vector3();
                        const GRAVITY = -9.8;

                        // Para el delta time correcto
                        let clock = new THREE.Clock();
                        
                        // Para el raycaster (detección de clicks)
                        let raycaster = new THREE.Raycaster();
                        let mouse = new THREE.Vector2();

                        // Variables para control de mouse
                        let mouseX = 0;
                        let mouseY = 0;

                        // ----------- INIT -----------
                        init();

                        function init() {
                            // Escena
                            scene = new THREE.Scene();
                            scene.background = new THREE.Color(0x87CEEB);

                            // Cámara
                            camera = new THREE.PerspectiveCamera(75, 800 / 600, 0.1, 1000);
                            camera.position.set(0, 2.0, 5);
                            camera.rotation.order = 'YXZ';

                            // Renderer
                            renderer = new THREE.WebGLRenderer({ 
                                antialias: true,
                                powerPreference: "high-performance"
                            });
            
                            const container = document.getElementById('threejs-container');
                            renderer.setSize(container.clientWidth, container.clientHeight);
                            renderer.shadowMap.enabled = true;
                            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                            container.appendChild(renderer.domElement);

                            // Hacer el canvas enfocable
                            renderer.domElement.setAttribute('tabindex', '0');
                            renderer.domElement.style.outline = 'none';

                            // ✅ EVENTO CLICK CORREGIDO - Usando PointerLock directo
                            container.addEventListener("click", () => {
                                console.log('🖱️ Click en contenedor - Activando PointerLock...');
                                
                                if (!isControlsEnabled) {
                                    // Solicitar PointerLock directamente en el canvas
                                    renderer.domElement.requestPointerLock = 
                                        renderer.domElement.requestPointerLock ||
                                        renderer.domElement.mozRequestPointerLock;
                                    
                                    renderer.domElement.requestPointerLock().catch(error => {
                                        console.error('❌ Error al activar PointerLock:', error);
                                    });
                                }
                            });

                            // ✅ EVENTO POINTERLOCK CHANGE CORREGIDO
                            document.addEventListener("pointerlockchange", () => {
                                isControlsEnabled = !!document.pointerLockElement;
                                console.log('🔄 PointerLock cambiado - isControlsEnabled:', isControlsEnabled);
                                
                                document.getElementById('reticula').style.display = isControlsEnabled ? 'block' : 'none';
                                
                                if (isControlsEnabled) {
                                    console.log('🎮 ✅ CONTROLES ACTIVADOS - Ya puedes usar W,A,S,D y MOUSE');
                                    renderer.domElement.focus();
                                } else {
                                    console.log('⛔ CONTROLES DESACTIVADOS');
                                    moveForward = moveBackward = moveLeft = moveRight = false;
                                }
                            });

                            // ✅ AGREGAR: CONTROL MANUAL DEL MOUSE
                            document.addEventListener("mousemove", (event) => {
                                if (!isControlsEnabled) return;
                                
                                const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
                                const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;
                                
                                const sensitivity = 0.002;
                                
                                camera.rotation.y -= movementX * sensitivity;
                                camera.rotation.x -= movementY * sensitivity;
                                
                                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                            });

                            // Luces
                            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
                            scene.add(ambient);

                            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
                            sun.position.set(50, 100, 50);
                            sun.target.position.set(0, 0, 0);
                            scene.add(sun.target);
                            sun.castShadow = true;
                            sun.shadow.bias = -0.0003;
                            sun.shadow.normalBias = 0.02;
                            sun.shadow.mapSize.width = 1024;
                            sun.shadow.mapSize.height = 1024;
                            sun.shadow.camera.top = 200;
                            sun.shadow.camera.bottom = -200;
                            sun.shadow.camera.left = -200;
                            sun.shadow.camera.right = 200;
                            sun.shadow.camera.near = 1;
                            sun.shadow.camera.far = 600;
                            sun.shadow.radius = 3;
                            scene.add(sun);

                            // Suelo
                            const floor = new THREE.Mesh(
                                new THREE.PlaneGeometry(200, 200),
                                new THREE.MeshStandardMaterial({ 
                                    color: 0x8a8a8a,
                                    roughness: 0.8,
                                    metalness: 0.2
                                })
                            );
                            floor.rotation.x = -Math.PI / 2;
                            floor.receiveShadow = true;
                            scene.add(floor);

                            // Cargar modelo de rampa
                            const loader = new THREE.GLTFLoader();
            
                            loader.load("ultimo27D.glb", gltf => {
                                ramp = gltf.scene;
                                
                                console.log("------ OBJETOS ENCONTRADOS EN EL GLB ------");
                                ramp.traverse(obj => {
                                    console.log(obj.name);
                                });
                                console.log("-------------------------------------------");
                                ramp.traverse(obj => {
                                    if (obj.isMesh) {
                                        obj.castShadow = true;
                                        obj.receiveShadow = true;
                                        
                                        if (obj.geometry.boundingBox === null) {
                                            obj.geometry.computeBoundingBox();
                                        }
                                        if (obj.name.includes('barandal')) {
                                            obj.userData.interactive = true;
                                            obj.userData.info = {
                                                title: "Rampa de Acceso",
                                                content: "Esta rampa cumple con los estándares de accesibilidad ADA."
                                            };
                                            interactiveObjects.push(obj);
                                        }
                                        if (obj.name.includes('punto_interes') || 
                                            obj.name.includes('info') || 
                                            obj.name.includes('señal')) {
                                            
                                            obj.userData.interactive = true;
                                            obj.userData.info = {
                                                title: "Información del objeto",
                                                content: "Este es un punto de interés en el modelo. Aquí puedes agregar información específica sobre este elemento."
                                            };
                                            
                                            if (obj.name.includes('Silla')) {
                                                obj.userData.info = {
                                                    title: "Rampa de Acceso",
                                                    content: "Esta rampa cumple con los estándares de accesibilidad ADA, con una pendiente máxima de 1:12 y pasamanos a ambos lados."
                                                };
                                            } 
                                            
                                            interactiveObjects.push(obj);
                                        }
                                    }
                                });
                                console.log("---- VERIFICANDO OBJETOS INTERACTIVOS ----");

                                ramp.traverse(obj => {
                                    if (obj.userData.interactive) {
                                        console.log("Objeto interactivo detectado:", obj.name);
                                    }
                                });

                                console.log("Lista final de interactivos:", interactiveObjects);
                                scene.add(ramp);
                                console.log("✅ Rampa cargada");
                                console.log("Objetos interactivos:", interactiveObjects.length);
                            });

                            // Cargar muros para colisión
                            loader.load("ultimo9D.glb", gltf => {
                                const model = gltf.scene;
                                model.traverse(obj => {
                                    if (obj.isMesh && obj.parent && obj.parent.name === "Plane.381") {
                                        if (obj.geometry.boundingBox === null) {
                                            obj.geometry.computeBoundingBox();
                                        }
                                        murosColliders.push(obj);
                                        obj.castShadow = true;
                                        obj.receiveShadow = true;
                                    }
                                });
                                scene.add(model);
                                console.log("✅ Muros cargados:", murosColliders.length);
                            });

                            // Eventos de teclado
                            document.addEventListener("keydown", onKeyDown);
                            document.addEventListener("keyup", onKeyUp);

                            // Evento ESC para desbloquear
                            document.addEventListener("keydown", (e) => {
                                if (e.code === "Escape" && isControlsEnabled) {
                                    document.exitPointerLock = 
                                        document.exitPointerLock ||
                                        document.mozExitPointerLock;
                                    document.exitPointerLock();
                                }
                            });

                            // Evento para detectar clicks en objetos
                            renderer.domElement.addEventListener('click', onMouseClick, false);
                            
                            // Evento para cerrar el cuadro de información
                            document.getElementById('close-info').addEventListener('click', function() {
                                document.getElementById('object-info').style.display = 'none';
                            });

                            // Iniciar el reloj
                            clock = new THREE.Clock();

                            animate();
                        }

                        function onWindowResize() {
                            const container = document.getElementById('threejs-container');
                            camera.aspect = container.clientWidth / container.clientHeight;
                            camera.updateProjectionMatrix();
                            renderer.setSize(container.clientWidth, container.clientHeight);
                        }

                        window.addEventListener('resize', onWindowResize);

                        // Función para manejar clicks del mouse
                        function onMouseClick(event) {
                            if (!isControlsEnabled) return;
                            const container = document.getElementById('threejs-container');
                            const rect = container.getBoundingClientRect();
                            
                            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                            
                            raycaster.setFromCamera(mouse, camera);
                            
                            const intersects = raycaster.intersectObjects(interactiveObjects, true);
                            
                            if (intersects.length > 0) {
                                const object = intersects[0].object;
                                showObjectInfo(object.userData.info);
                                highlightObject(object);
                            }
                        }
                        
                        // Función para mostrar información del objeto
                        function showObjectInfo(info) {
                            document.getElementById("info-title").textContent = info.title;
                            document.getElementById("info-content").textContent = info.content;
                            document.getElementById('object-info').style.display = 'block';
                        }
                        
                        // Función para resaltar objeto seleccionado
                        function highlightObject(object) {
                            if (!object.userData.originalMaterial) {
                                object.userData.originalMaterial = object.material.clone();
                            }
                            
                            object.material.emissive = new THREE.Color(0x444444);
                            
                            setTimeout(() => {
                                object.material.emissive = new THREE.Color(0x000000);
                            }, 500);
                        }

                        function onKeyDown(e) {
                            console.log('Tecla presionada:', e.code, 'isControlsEnabled:', isControlsEnabled);
                            if (!isControlsEnabled) {
                                console.log('⛔ Tecla ignorada - controles no activos');
                                return;
                            }
                            if (e.code === "KeyW") moveForward = true;
                            if (e.code === "KeyS") moveBackward = true;
                            if (e.code === "KeyA") moveLeft = true;
                            if (e.code === "KeyD") moveRight = true;
                            
                            if (e.code === "Escape") {
                                document.getElementById('object-info').style.display = 'none';
                            }
                        }

                        function onKeyUp(e) {
                            if (!isControlsEnabled) return;
                            if (e.code === "KeyW") moveForward = false;
                            if (e.code === "KeyS") moveBackward = false;
                            if (e.code === "KeyA") moveLeft = false;
                            if (e.code === "KeyD") moveRight = false;
                        }

                        // MOVIMIENTO + GRAVEDAD + COLISIONES
                        function updateMovement(delta) {
                            if (!isControlsEnabled) return;
                            
                            const speed = 6;
                            const dir = new THREE.Vector3();
                            
                            if (moveForward) dir.z -= 1;
                            if (moveBackward) dir.z += 1;
                            if (moveLeft) dir.x -= 1;
                            if (moveRight) dir.x += 1;

                            dir.normalize();
                            
                            // ✅ MOVIMIENTO CORREGIDO - Aplicar rotación de cámara
                            const euler = new THREE.Euler(0, camera.rotation.y, 0, 'YXZ');
                            dir.applyEuler(euler);
                            
                            const displacement = dir.multiplyScalar(speed * delta);
                            const nextPos = camera.position.clone().add(displacement);

                            // ✅ COLISIONES ACTIVADAS
                            if (!detectWallCollision(nextPos)) {
                                camera.position.copy(nextPos);
                            }

                            // Gravedad
                            velocity.y += GRAVITY * delta;
                            camera.position.y += velocity.y * delta;

                            const groundY = detectGroundHeight();

                            if (camera.position.y < groundY + 1.6) {
                                camera.position.y = groundY + 1.6;
                                velocity.y = 0;
                            }
                        }

                        // COLISIÓN CON MUROS
                        function detectWallCollision(nextPos) {
                            const playerBox = new THREE.Box3().setFromCenterAndSize(
                                nextPos.clone(),
                                new THREE.Vector3(0.6, 1.6, 0.6)
                            );

                            for (let muro of murosColliders) {
                                muro.updateMatrixWorld();
                                
                                const muroBox = muro.geometry.boundingBox.clone();
                                muroBox.applyMatrix4(muro.matrixWorld);

                                if (playerBox.intersectsBox(muroBox)) {
                                    console.log('🚫 Colisión detectada');
                                    return true;
                                }
                            }
                            return false;
                        }

                        // DETECTAR SUELO
                        function detectGroundHeight() {
                            const ray = new THREE.Raycaster(
                                camera.position.clone().add(new THREE.Vector3(0, 0.5, 0)),
                                new THREE.Vector3(0, -1, 0),
                                0,
                                10
                            );

                            let lowest = 0;
                            let hits = [];

                            scene.traverse(obj => {
                                if (obj.isMesh && (obj !== murosColliders.find(m => m === obj))) {
                                    const objectHits = ray.intersectObject(obj, true);
                                    hits = hits.concat(objectHits);
                                }
                            });

                            if (hits.length > 0) {
                                hits.sort((a, b) => a.distance - b.distance);
                                lowest = hits[0].point.y;
                            }

                            return lowest;
                        }

                        // LOOP DE ANIMACIÓN
                        function animate() {
                            requestAnimationFrame(animate);

                            const delta = Math.min(clock.getDelta(), 0.033);

                            if (isControlsEnabled) {
                                updateMovement(delta);
                            }

                            renderer.render(scene, camera);
                        }
                    </script>
                </div>
                <div >
                    <div>
                        <a href="index.html" class="btn">Volver</a>
                    </div>
                    
                </div>
            </div>
            
        </main>

    </body>
</html>
